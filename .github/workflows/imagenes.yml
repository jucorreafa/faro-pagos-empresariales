# ---------------------------------------------------------------
# CI (adelanto de S8): en cada cambio a main, GitHub construye las 3
# imágenes Docker y las publica en GitHub Container Registry (gratis
# en repositorios públicos). Kubernetes (carpeta k8s/) usa esas imágenes.
# ---------------------------------------------------------------
name: Imagenes Docker
on:
  push:
    branches: [main]
    paths: ["servicios/**", ".github/workflows/imagenes.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [bce, banco-andino, faro-api]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/faro-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: servicios/${{ matrix.servicio }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
